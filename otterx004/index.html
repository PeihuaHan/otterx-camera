<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>OTTERX004 Camera</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-vessel="otterx004">
  <main class="camera-view">
    <section class="stream-layer active" data-stream="front" aria-hidden="false">
      <video playsinline muted autoplay aria-label="Front camera stream"></video>
    </section>
    <section class="stream-layer" data-stream="rear" aria-hidden="true">
      <video playsinline muted autoplay aria-label="Rear camera stream"></video>
    </section>
    <div class="stream-message" id="stream-message" hidden>
      <strong></strong>
      <span></span>
    </div>
    <nav class="view-switcher" aria-label="Select camera view">
      <button type="button" class="active" data-camera="front" aria-pressed="true">Front</button>
      <button type="button" data-camera="rear" aria-pressed="false">Rear</button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" id="aspect-toggle" aria-pressed="true">Keep ratio</button>
    </nav>
    <button type="button" id="logout" class="corner-button" title="Sign out">Sign out</button>
    <div class="latency-bar" id="latency" aria-live="off" hidden>
      <div class="lat-item" title="Edge (vessel) to cloud video server, reported over MQTT"><span>Edge→Cloud</span><b data-lat="edge">–</b></div>
      <div class="lat-item" title="Cloud to this browser: half the WebRTC round-trip time"><span>Network</span><b data-lat="network">–</b></div>
      <div class="lat-item" title="Jitter buffer delay (packet jitter in brackets)"><span>Jitter buf</span><b data-lat="jitter">–</b></div>
      <div class="lat-item" title="Frame decode time in the browser"><span>Decode</span><b data-lat="decode">–</b></div>
      <div class="lat-item" title="Browser render/compositing to screen"><span>Display</span><b data-lat="display">–</b></div>
      <div class="lat-item total" title="Sum of the above. Camera capture and encode on the vessel are not included."><span>Total</span><b data-lat="total">–</b></div>
    </div>
    <div class="login" id="login" hidden>
      <form autocomplete="on">
        <h1>OTTERX004 cameras</h1>
        <p>Sign in with the video server account.</p>
        <p class="error" id="login-error" hidden></p>
        <label>Username <input name="user" autocomplete="username" required></label>
        <label>Password <input name="pass" type="password" autocomplete="current-password" required></label>
        <label class="remember"><input name="remember" type="checkbox" checked> Remember on this device</label>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="../assets/camera.js"></script>
  <script src="../assets/latency.js"></script>
</body>
</html>
